name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

# Superseded PR runs are cancelled. Main and dispatch runs each get their own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require a ready PR
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        run: |
          echo '::error::Mark this PR ready for review to run the required checks.'
          exit 1

      # Markdown under plans or docs and root Markdown skip workspace checks. Package READMEs
      # and other data read by tests still count as code. Main and dispatch check every file.
      - name: Classify changed files
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        timeout-minutes: 5
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!plans/**/*.md'
              - '!docs/**/*.md'
              - '!*.md'

      - name: Checkout
        if: &code ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup
        if: *code
        uses: ./.github/actions/setup

      - name: Check browser cache platform isolation
        if: *code
        run: bun scripts/ci/browser-cache-platform.ts

      - name: Playwright versions and platform
        if: *code
        id: playwright
        shell: bash
        run: |
          . /etc/os-release
          : "${ID:?}" "${VERSION_ID:?}"
          editor=$(packages/editor/node_modules/.bin/playwright --version | cut -d ' ' -f 2)
          site=$(site/node_modules/.bin/playwright --version | cut -d ' ' -f 2)
          printf '%s\n' "platform=${ID}-${VERSION_ID}-${{ runner.arch }}" \
            "editor=${editor:?}" "site=${site:?}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: *code
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-v3-${{ runner.os }}-${{ steps.playwright.outputs.platform }}-${{ steps.playwright.outputs.editor }}-${{ steps.playwright.outputs.site }}

      # The system packages come from cached files, so a slow package mirror cannot stall the job.
      - name: Install Playwright system packages
        if: *code
        uses: ./.github/actions/playwright-deps
        with:
          playwright: packages/editor/node_modules/.bin/playwright
          browsers: chromium chromium-headless-shell firefox webkit

      # The site pins a different Playwright release. Its Chromium needs nothing beyond the
      # editor's packages today, so this step is quick; a release that adds one installs it.
      - name: Install Playwright system packages for the site
        if: *code
        uses: ./.github/actions/playwright-deps
        with:
          playwright: site/node_modules/.bin/playwright
          browsers: chromium

      # The editor's browser projects also need the headless shell. The site uses a
      # different Playwright release for build-time capture.
      - name: Install Playwright browsers
        if: *code
        run: |
          packages/editor/node_modules/.bin/playwright install chromium chromium-headless-shell firefox webkit
          site/node_modules/.bin/playwright install chromium

      # Typecheck and test reuse these builds through Turbo. Cap build and check
      # concurrency at the four CPUs on the hosted runner.
      - name: Build packages
        if: *code
        run: bun run build -- --concurrency=4 --filter='./packages/*'

      - name: Check turbo inputs
        if: *code
        run: bun scripts/check-turbo-inputs.mjs

      - name: Check native language catalog
        if: *code
        run: bun run --cwd packages/tree-sitter-languages languages:generate -- --check

      # Health reads the built package exports.
      - name: Check architecture health baselines
        if: *code
        run: bun run health

      - name: Check CI test ownership and mutation controls
        if: *code
        run: bun run test:ci

      - name: Typecheck
        if: *code
        run: bun run typecheck -- --concurrency=4

      - name: Lint
        if: *code
        run: bun run lint -- --concurrency=4

      # Typecheck already built the site. Run its tests on the runner that has that build.
      - name: Test documentation site
        if: &code-unless-cancelled ${{ !cancelled() && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true') }}
        run: bun run test -- --filter=singapore-editor-site

      - name: Test core editor
        if: *code
        timeout-minutes: 20
        run: bun run test -- --filter=@singapore-editor/core --log-order=stream

      - name: Test TypeScript source worker and browser parity
        if: *code
        run: bun run test:browser -- --concurrency=1 --filter=@singapore-editor/typescript-lsp

      # Each Vitest process sizes its worker pool for the whole runner. Serialize packages
      # so cache misses cannot multiply those pools and starve CPU-heavy tests.
      - name: Test (no browser)
        if: *code
        run: >-
          bun run test -- --concurrency=1
          --filter=@singapore-editor/file-animation
          --filter=@singapore-editor/diff
          --filter=@singapore-editor/gutters
          --filter=@singapore-editor/lsp
          --filter=@singapore-editor/lsp-plugin
          --filter=@singapore-editor/markdown
          --filter=@singapore-editor/panes
          --filter=@singapore-editor/textbuffer
          --filter=@singapore-editor/tree-sitter-languages
          --filter=@singapore-editor/typescript-lsp

      - name: Test (browser)
        if: *code-unless-cancelled
        run: >-
          bun run test -- --concurrency=1
          --filter=!@singapore-editor/core
          --filter=!@singapore-editor/file-animation
          --filter=!@singapore-editor/diff
          --filter=!@singapore-editor/gutters
          --filter=!@singapore-editor/lsp
          --filter=!@singapore-editor/lsp-plugin
          --filter=!@singapore-editor/markdown
          --filter=!@singapore-editor/panes
          --filter=!@singapore-editor/textbuffer
          --filter=!@singapore-editor/tree-sitter-languages
          --filter=!@singapore-editor/typescript-lsp
          --filter=!singapore-editor-site

      # Each save carries restored entries forward. Drop entries older than three days.
      - name: Prune turbo cache
        if: ${{ always() && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true') }}
        run: find .turbo/cache -type f -mtime +3 -delete 2>/dev/null || true

  update-status:
    name: Report automated update status
    needs: ci
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/automation/tree-sitter-updates' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      # Dispatch job checks do not satisfy PR requirements. Commit statuses do.
      - name: Report the real CI verdict on the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD: ${{ github.sha }}
          RESULT: ${{ needs.ci.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=failure
          if [[ "$RESULT" == success ]]; then state=success; fi
          gh api --method POST "repos/$GH_REPO/statuses/$HEAD" \
            -f context=CI -f state="$state" -f target_url="$RUN_URL" \
            -f description="Dispatched CI: $RESULT"
