name: Finish profiling instrumentation

on:
  push:
    branches: ['bench/textbuffer-vscode']
    paths: ['.github/workflows/profile-initialize.yml']

permissions:
  contents: write

jobs:
  finish:
    if: github.ref == 'refs/heads/bench/textbuffer-vscode'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Format and verify
        run: |
          bun run format
          bun run format:check
          bun run --cwd packages/textbuffer verify
          bun run --cwd packages/textbuffer bench:check
          bun run --cwd packages/textbuffer bench:profile:check
          bun run --cwd packages/textbuffer lint
          bun run health
      - name: Commit formatting and remove this completed helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git rm .github/workflows/profile-initialize.yml
          git diff --cached --check
          git commit -m 'style: format profiler and remove completed initialization workflow'
          git push origin HEAD:refs/heads/bench/textbuffer-vscode
