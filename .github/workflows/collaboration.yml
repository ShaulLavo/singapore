name: Collaboration session

on:
  schedule:
    - cron: '37 2 * * *'
  workflow_dispatch:
    inputs:
      long_run:
        description: Run 10,000 deterministic network simulations
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: collaboration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build package and editor dependencies
        run: bun run build -- --filter=@singapore-editor/collaboration... --filter=@singapore-editor/diff...
      - name: Check types, lint and formatting
        run: |
          bun run --cwd packages/collaboration typecheck
          bun run --cwd packages/collaboration lint
          bun run --cwd packages/collaboration format:check
      - name: Verify session and network invariants
        env:
          COLLABORATION_LONG_RUN: ${{ (github.event_name == 'schedule' || inputs.long_run) && '1' || '0' }}
        run: bun run --cwd packages/collaboration test
      - name: Verify the signaling broker
        run: bun run --cwd packages/collaboration test:server
      - name: Install Chromium
        working-directory: packages/editor
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify native WebRTC, same-origin tabs and presence
        run: bun run --cwd packages/collaboration test:browser
      - name: Verify concurrent editor input and author undo
        run: bun run --cwd packages/collaboration test:editor
