name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build packages
        run: bun run build -- --filter=./packages/*

      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2
        with:
          # The action runs these without a shell, so `&&` lives in package scripts. It sets
          # CHANGESETS_OUTPUT; `changeset git-tag` writes the new tags there for the action to
          # push and turn into GitHub releases.
          version-script: bun run version:packages
          publish-script: bun run release:publish
          create-github-releases: true
        env:
          NPM_CONFIG_PROVENANCE: 'true'
