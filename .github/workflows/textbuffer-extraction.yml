name: Textbuffer extraction

# One-shot development runner for this review branch only. Remove after extraction.
on:
  push:
    branches: ['refactor/extract-textbuffer']
    paths:
      - 'scripts/extract-textbuffer.mjs'
      - '.github/workflows/textbuffer-extraction.yml'

permissions:
  contents: read

concurrency:
  group: textbuffer-extraction
  cancel-in-progress: false

jobs:
  extract-and-verify:
    if: github.repository == 'ShaulLavo/singapore' && github.ref == 'refs/heads/refactor/extract-textbuffer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Apply guarded extraction
        run: |
          if [ ! -d packages/textbuffer ]; then
            node scripts/extract-textbuffer.mjs
          fi
      - name: Resolve workspace lockfile
        run: bun install
      - name: Format and check
        run: |
          bun run format
          bun run format:check
      - name: Commit extracted sources to review branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add packages/textbuffer packages/editor/src/documentTextSourceCache.ts docs/storage/textbuffer-extraction.md
          if ! git diff --cached --quiet; then
            git commit -m 'refactor: extract standalone textbuffer and invert editor dependencies'
            git push origin HEAD:refs/heads/refactor/extract-textbuffer
          fi
      - name: Verify standalone package
        run: bun run --cwd packages/textbuffer verify
      - name: Verify independently of the monorepo
        run: |
          destination="$(mktemp -d)/singapore-textbuffer"
          mkdir -p "$destination"
          tar -C packages/textbuffer --exclude=node_modules --exclude=dist --exclude=coverage -cf - . | tar -C "$destination" -xf -
          cd "$destination"
          bun install
          bun run verify
          tar --exclude=node_modules --exclude=dist --exclude=coverage -czf "$RUNNER_TEMP/singapore-textbuffer.tar.gz" .
      - name: Upload standalone source
        uses: actions/upload-artifact@v4
        with:
          name: singapore-textbuffer-source
          path: ${{ runner.temp }}/singapore-textbuffer.tar.gz
          if-no-files-found: error
      - name: Typecheck workspace
        run: bun run typecheck
      - name: Lint workspace
        run: bun run lint
      - name: Install browser test dependencies
        working-directory: packages/editor
        run: ./node_modules/.bin/playwright install --with-deps chromium chromium-headless-shell
      - name: Test tree-sitter browser worker
        run: bun run --cwd packages/tree-sitter test:browser
      - name: Test workspace
        run: bun run test -- --concurrency=1
