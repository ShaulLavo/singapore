name: Direct textbuffer imports

on:
  push:
    branches: ['refactor/extract-textbuffer']
    paths:
      - 'scripts/remove-textbuffer-shims.mjs'
      - '.github/workflows/remove-textbuffer-shims.yml'

permissions:
  contents: write

concurrency:
  group: direct-textbuffer-imports
  cancel-in-progress: true

jobs:
  migrate-and-verify:
    if: github.repository == 'ShaulLavo/singapore' && github.ref == 'refs/heads/refactor/extract-textbuffer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Migrate imports and remove shims
        run: node scripts/remove-textbuffer-shims.mjs
      - name: Resolve dependency declarations
        run: bun install
      - name: Refresh and validate intentional architecture changes
        run: |
          cp docs/architecture/phase-0/core-public-api.json "$RUNNER_TEMP/api-before.json"
          cp docs/architecture/phase-0/timer-usage.json "$RUNNER_TEMP/timers-before.json"
          bun run health:write
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          const read = (path) => JSON.parse(readFileSync(path, 'utf8'))
          const api = (data) => data.entrypoints.map((entry) => ({
            ...entry,
            exports: entry.exports.map(({source, via, ...value}) => value).sort((a,b) => JSON.stringify(a).localeCompare(JSON.stringify(b))),
          }))
          assert.deepEqual(api(read('docs/architecture/phase-0/core-public-api.json')), api(read(process.env.RUNNER_TEMP + '/api-before.json')), 'Core public API changed beyond import routes')
          const ids = (data) => data.timers.map((timer) => timer.id).sort()
          assert.deepEqual(ids(read('docs/architecture/phase-0/timer-usage.json')), ids(read(process.env.RUNNER_TEMP + '/timers-before.json')), 'Unexpected timer changes')
          NODE
          bun run health
      - name: Format and check
        run: |
          bun run format
          bun run format:check
          git diff --check
      - name: Build and typecheck workspace
        run: bun run typecheck
      - name: Lint workspace
        run: bun run lint
      - name: Verify standalone package
        run: bun run --cwd packages/textbuffer verify
      - name: Verify import-boundary regression tests
        run: bun run --cwd packages/editor test test/textbufferImports.node.test.ts
      - name: Install browser test dependencies
        working-directory: packages/editor
        run: ./node_modules/.bin/playwright install --with-deps chromium chromium-headless-shell
      - name: Test tree-sitter browser worker
        run: bun run --cwd packages/tree-sitter test:browser
      - name: Test complete workspace
        run: bun run test -- --concurrency=1
      - name: Commit verified changes to PR branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/refactor/extract-textbuffer | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add packages/editor/test/textbufferImports.node.test.ts
          git diff --cached --check
          git commit -m 'refactor: import textbuffer directly and remove editor shims'
          git push origin HEAD:refs/heads/refactor/extract-textbuffer
      - name: Collect migration evidence
        if: always()
        run: |
          git diff --binary '${{ github.sha }}' > "$RUNNER_TEMP/direct-textbuffer-imports.patch"
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=.turbo --exclude=coverage -czf "$RUNNER_TEMP/direct-textbuffer-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: direct-textbuffer-imports
          path: |
            ${{ runner.temp }}/direct-textbuffer-imports.patch
            ${{ runner.temp }}/direct-textbuffer-source.tar.gz
          if-no-files-found: error
