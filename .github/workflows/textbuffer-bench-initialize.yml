name: Initialize textbuffer benchmarks

on:
  push:
    branches: ['bench/textbuffer-vscode']
    paths:
      - '.github/workflows/textbuffer-bench-initialize.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: bench/textbuffer-vscode
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - name: Format and commit only to the benchmark review branch
        run: |
          bun run format
          bun run format:check
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'style: format benchmark harness'
            git push origin HEAD:refs/heads/bench/textbuffer-vscode
          fi
      - name: Verify package and benchmark contracts
        run: |
          bun run --cwd packages/textbuffer verify
          bun run --cwd packages/textbuffer lint
          bun run --cwd packages/textbuffer bench:check
          bun run health
      - name: Smoke and measure
        run: |
          bun run --cwd packages/textbuffer bench -- --profile smoke
          bun run --cwd packages/textbuffer bench -- --profile standard
          cat packages/textbuffer/bench/results/standard.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save evidence and source for inspection
        if: always()
        run: |
          mkdir -p /tmp/textbuffer-bench-evidence
          cp -r packages/textbuffer/bench/results /tmp/textbuffer-bench-evidence/ 2>/dev/null || true
          tar -C packages/textbuffer --exclude=node_modules --exclude=dist --exclude=.turbo -czf /tmp/textbuffer-bench-evidence/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: initial-textbuffer-benchmark-evidence
          path: /tmp/textbuffer-bench-evidence/
