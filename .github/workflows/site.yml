name: Singapore site

on:
  pull_request:
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/site.yml'
      - 'examples/app/**'
      - 'packages/**'
      - 'scripts/product-sites/**'
      - 'site/**'
      - 'bun.lock'
      - 'package.json'
      - 'wrangler.singapore.jsonc'
  push:
    branches: ['main']
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/site.yml'
      - 'examples/app/**'
      - 'packages/**'
      - 'scripts/product-sites/**'
      - 'site/**'
      - 'bun.lock'
      - 'package.json'
      - 'wrangler.singapore.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - name: Check exact domain configuration and cache headers
        run: python3 -m unittest discover -s scripts/product-sites -p 'test_*.py'
      - name: Install the pinned site capture browser
        run: bun x --cwd site playwright install chromium
      - name: Build the docs and demo deployment
        run: bash scripts/product-sites/build.sh "$RUNNER_TEMP/singapore-site-dist"
      - name: Check the published routes
        run: |
          test -f "$RUNNER_TEMP/singapore-site-dist/index.html"
          test -f "$RUNNER_TEMP/singapore-site-dist/demo/index.html"
          test -f "$RUNNER_TEMP/singapore-site-dist/_headers"
      - name: Keep the build for deployment
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: singapore-site-dist
          path: ${{ runner.temp }}/singapore-site-dist
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: singapore-site
      url: https://singapore.shaulavo.dev/
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: wrangler.singapore.jsonc
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: singapore-site-dist
          path: dist
      - name: Deploy to singapore.shaulavo.dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret to deploy the site. docs/site-deployment.md lists the permissions it needs."
            exit 1
          fi
          bunx --bun wrangler@4.149.0 deploy --config wrangler.singapore.jsonc
      - name: Check the live site
        run: |
          curl -fsS -o /dev/null https://singapore.shaulavo.dev/
          curl -fsS -o /dev/null https://singapore.shaulavo.dev/demo/
