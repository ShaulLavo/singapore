name: Singapore site

on:
  pull_request:
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/site.yml'
      - 'examples/app/**'
      - 'packages/**'
      - 'scripts/product-sites/**'
      - 'site/**'
      - 'bun.lock'
      - 'package.json'
      - 'wrangler.singapore.jsonc'
  push:
    branches: ['main']
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/site.yml'
      - 'examples/app/**'
      - 'packages/**'
      - 'scripts/product-sites/**'
      - 'site/**'
      - 'bun.lock'
      - 'package.json'
      - 'wrangler.singapore.jsonc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - name: Check exact domain configuration and cache headers
        run: python3 -m unittest discover -s scripts/product-sites -p 'test_*.py'
      - name: Install the pinned site capture browser
        run: bun x --cwd site playwright install --with-deps chromium
      - name: Build the docs and demo deployment
        run: |
          rm -rf dist
          bash scripts/product-sites/build.sh dist
      - name: Check the published routes
        run: |
          test -f dist/index.html
          test -f dist/demo/index.html
          test -f dist/_headers
      - name: Upload the validated docs and demo
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: singapore-site
          path: dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: product-sites-singapore
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Download the validated docs and demo
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: singapore-site
          path: dist
      - name: Deploy Singapore Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler@4.149.0 deploy --config wrangler.singapore.jsonc
