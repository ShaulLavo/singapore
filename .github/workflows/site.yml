name: Singapore site

on:
  pull_request:
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/site.yml'
      - 'examples/app/**'
      - 'packages/**'
      - 'scripts/product-sites/**'
      - 'site/**'
      - 'bun.lock'
      - 'package.json'
      - 'wrangler.singapore.jsonc'
  push:
    branches: ['main']
    paths:
      - '.github/actions/setup/**'
      - '.github/workflows/site.yml'
      - 'examples/app/**'
      - 'packages/**'
      - 'scripts/product-sites/**'
      - 'site/**'
      - 'bun.lock'
      - 'package.json'
      - 'wrangler.singapore.jsonc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: ./.github/actions/setup
      - name: Check exact domain configuration and cache headers
        run: python3 -m unittest discover -s scripts/product-sites -p 'test_*.py'
      - name: Build the docs and demo deployment
        run: bash scripts/product-sites/build.sh "$RUNNER_TEMP/singapore-site-dist"
      - name: Check the published routes
        run: |
          test -f "$RUNNER_TEMP/singapore-site-dist/index.html"
          test -f "$RUNNER_TEMP/singapore-site-dist/demo/index.html"
          test -f "$RUNNER_TEMP/singapore-site-dist/_headers"
