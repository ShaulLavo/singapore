name: Standalone textbuffer

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/textbuffer/**'
      - 'bun.lock'
      - '.github/workflows/textbuffer.yml'
  push:
    branches: ['main']
    paths:
      - 'packages/textbuffer/**'
      - 'bun.lock'
      - '.github/workflows/textbuffer.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: ${{ (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - name: Install locked workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify package entry points and tests
        run: bun run --cwd packages/textbuffer verify
      - name: Verify without the editor or monorepo tooling
        run: |
          destination="$(mktemp -d)"
          tar -C packages/textbuffer --exclude=node_modules --exclude=dist --exclude=coverage --exclude=.turbo -cf - . | tar -C "$destination" -xf -
          cd "$destination"
          bun install
          bun run verify
