name: Playwright system packages
description: Installs the Linux packages Playwright browsers need from cached .deb files, and falls back to a time-limited apt install when the cache is cold.

inputs:
  playwright:
    description: Path to the Playwright CLI, relative to the repository root.
    required: true
  browsers:
    description: Space-separated browsers whose system packages are needed.
    required: true

runs:
  using: composite
  steps:
    # The package list depends on the Playwright release and the browsers. The runner image
    # version is part of the key because the saved files are only valid on the image they were
    # downloaded for: a newer image can ship newer libraries that older files would downgrade.
    - name: Compute the package cache key
      id: key
      shell: bash
      env:
        PLAYWRIGHT: ${{ inputs.playwright }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        . /etc/os-release
        : "${ID:?}" "${VERSION_ID:?}"
        version=$("$PLAYWRIGHT" --version | cut -d ' ' -f 2)
        printf 'key=%s\n' "playwright-debs-v2-${ID}-${VERSION_ID}-${RUNNER_ARCH}-${ImageVersion:-unknown}-${version:?}-${BROWSERS// /-}" >> "$GITHUB_OUTPUT"

    - name: Restore the package cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-debs
        key: ${{ steps.key.outputs.key }}

    # The saved files are installed with dpkg, which needs no network, and a failed attempt is
    # repaired before anything else runs. Success is decided afterwards
    # by `ready`: dpkg reports no half-installed package and Playwright finds nothing missing.
    # A cold or unusable cache falls through to the real install, which is time-limited so a slow
    # mirror fails with a clear message, and which keeps the downloaded files for the save step.
    - name: Install system packages
      id: install
      shell: bash
      env:
        PLAYWRIGHT: ${{ inputs.playwright }}
        BROWSERS: ${{ inputs.browsers }}
      run: |
        debs="$HOME/.cache/playwright-debs"
        limit=600

        fail() {
          echo "::error::$1"
          exit 1
        }

        # Apt's simulation exits zero for a half-configured package, so check dpkg as well.
        ready() {
          [ -z "$(sudo dpkg --audit)" ] || return 1
          # shellcheck disable=SC2086 # BROWSERS is a list of words.
          "$PLAYWRIGHT" install-deps --dry-run $BROWSERS
        }

        # Nothing to do when an earlier step already provided everything.
        if ready; then
          echo "Playwright system packages are already in place."
          exit 0
        fi

        if compgen -G "$debs/*.deb" > /dev/null; then
          # dpkg, not apt: apt downloads again from the mirror even for files it was handed.
          if ! sudo dpkg -i "$debs"/*.deb; then
            echo "::warning::Cached system packages did not install; repairing before using apt."
            sudo dpkg --configure -a || true
            sudo timeout "$limit" apt-get install -f -y || true
          fi
        fi
        if ready; then
          echo "Playwright system packages are in place."
          exit 0
        fi

        # apt stamps downloaded files with the mirror's date, so compare listings, not times.
        before=$(mktemp)
        after=$(mktemp)
        sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' | sort > "$before"
        printf '%s\n' 'APT::Keep-Downloaded-Packages "true";' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99playwright-deps > /dev/null
        status=0
        # shellcheck disable=SC2086
        timeout --kill-after=30 "$limit" "$PLAYWRIGHT" install-deps $BROWSERS || status=$?
        if [ "$status" -eq 124 ]; then
          sudo pkill -x apt-get || true
          sudo dpkg --configure -a || true
          fail "Installing Playwright system packages did not finish in ${limit} seconds, so the package mirror is probably slow. Re-run the job when it recovers."
        fi
        [ "$status" -eq 0 ] || fail "Installing Playwright system packages failed with exit code ${status}."
        ready || fail "Playwright system packages are still incomplete after the install."

        sudo find /var/cache/apt/archives -maxdepth 1 -name '*.deb' | sort > "$after"
        mkdir -p "$debs"
        comm -13 "$before" "$after" | sudo xargs -r cp -t "$debs"
        sudo chown -R "$(id -u):$(id -g)" "$debs"
        count=$(find "$debs" -name '*.deb' | wc -l)
        echo "Kept $count downloaded packages for the cache."
        if [ "$count" -gt 0 ]; then
          echo "downloaded=true" >> "$GITHUB_OUTPUT"
        fi

    # Save right away, so a later failing step cannot lose the files. Pull requests from forks
    # restore the cache but never write it.
    - name: Save the package cache
      if: steps.install.outputs.downloaded == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-debs
        key: ${{ steps.key.outputs.key }}
